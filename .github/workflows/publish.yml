name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.132
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      postgrest:
        image: public.ecr.aws/supabase/postgrest:v14.12
        env:
          PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/kan23_jdbc_tests
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: kan37_reader
          PGRST_DB_PRE_REQUEST: public.kan37_request_setup
        ports:
          - 55325:3000
    env:
      PGPASSWORD: postgres
      PG_INTEGRATION_JDBC_URL: jdbc:postgresql://127.0.0.1:55322/postgres
      PG_KAN37_GENERATED_URL: jdbc:postgresql://127.0.0.1:55322/kan37_generated_tests
      PG_JDBC_TEST_URL: jdbc:postgresql://127.0.0.1:55322/kan23_jdbc_tests
      PG_JDBC_TEST_ADMIN_USER: supabase_admin
      PG_CROSS_SCHEMA_HTTP_URL: http://127.0.0.1:55325/rpc/kan37_graphql
      PG_RETRY_JDBC_URL: jdbc:postgresql://127.0.0.1:55322/kan22_retry_tests
      PG_DBOS_JDBC_URL: jdbc:postgresql://127.0.0.1:55322/kan22_dbos_tests
      PG_GRAPHQL_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Initialize isolated integration databases
        run: |
          for database in postgres kan23_jdbc_tests kan22_retry_tests kan22_dbos_tests kan37_generated_tests; do
            if [ "$database" != postgres ]; then
              psql -h 127.0.0.1 -p 55322 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            fi
            psql -h 127.0.0.1 -p 55322 -U postgres -d "$database" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_graphql'
          done
      - name: Build and publish Maven repository
        run: >-
          ./gradlew build publish --no-parallel --no-daemon --max-workers=3
          -PisolatedRepository=${{ github.workspace }}/build/pages-repository
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages-repository

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish Maven repository
        id: deployment
        uses: actions/deploy-pages@v5
