name: Verify pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.132
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
      PG_INTEGRATION_JDBC_URL: jdbc:postgresql://127.0.0.1:55322/postgres
      PG_JDBC_TEST_URL: jdbc:postgresql://127.0.0.1:55322/kan23_jdbc_tests
      PG_RETRY_JDBC_URL: jdbc:postgresql://127.0.0.1:55322/kan22_retry_tests
      PG_DBOS_JDBC_URL: jdbc:postgresql://127.0.0.1:55322/kan22_dbos_tests
      PG_GRAPHQL_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Initialize isolated integration databases
        run: |
          for database in postgres kan23_jdbc_tests kan22_retry_tests kan22_dbos_tests; do
            if [ "$database" != postgres ]; then
              psql -h 127.0.0.1 -p 55322 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            fi
            psql -h 127.0.0.1 -p 55322 -U postgres -d "$database" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_graphql'
          done
      - name: Build and verify without publishing
        run: ./gradlew build --no-parallel --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-reports
          path: |
            **/build/test-results/**
            **/build/reports/**

  oauth-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/oauth-provider-sample
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.132
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      TEST_DATABASE_ADMIN_JDBC_URL: jdbc:postgresql://127.0.0.1:55322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/oauth-provider-sample/package-lock.json
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify sample frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run typecheck
          npm run build
      - name: Regenerate schema and test without existing initialization
        run: ./scripts/verify-schema.sh
      - name: Build sample distribution
        run: ./gradlew installDist
        working-directory: examples/oauth-provider-sample/backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oauth-sample-reports
          path: examples/oauth-provider-sample/backend/build/test-results/**
