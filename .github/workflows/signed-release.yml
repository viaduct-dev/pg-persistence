name: Build signed artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version without the v prefix
        required: true
        default: 0.1.0-SNAPSHOT
        type: string

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.132
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      postgrest:
        image: public.ecr.aws/supabase/postgrest:v14.12
        env:
          PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/kan23_jdbc_tests
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: kan37_reader
          PGRST_DB_PRE_REQUEST: public.kan37_request_setup
        ports:
          - 55325:3000
    env:
      PGPASSWORD: postgres
      PG_INTEGRATION_JDBC_URL: jdbc:postgresql://127.0.0.1:55322/postgres
      PG_KAN37_GENERATED_URL: jdbc:postgresql://127.0.0.1:55322/kan37_generated_tests
      PG_JDBC_TEST_URL: jdbc:postgresql://127.0.0.1:55322/kan23_jdbc_tests
      PG_JDBC_TEST_ADMIN_USER: supabase_admin
      PG_CROSS_SCHEMA_HTTP_URL: http://127.0.0.1:55325/rpc/kan37_graphql
      PG_RETRY_JDBC_URL: jdbc:postgresql://127.0.0.1:55322/kan22_retry_tests
      PG_DBOS_JDBC_URL: jdbc:postgresql://127.0.0.1:55322/kan22_dbos_tests
      PG_GRAPHQL_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Initialize isolated integration databases
        run: |
          for database in postgres kan23_jdbc_tests kan22_retry_tests kan22_dbos_tests kan37_generated_tests; do
            if [ "$database" != postgres ]; then
              psql -h 127.0.0.1 -p 55322 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            fi
            psql -h 127.0.0.1 -p 55322 -U postgres -d "$database" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_graphql'
          done

      - name: Resolve release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$REQUESTED_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate signing secrets
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for name in SIGNING_KEY_ID SIGNING_KEY SIGNING_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Build signed Maven repository
        env:
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew clean build publish
          -PreleaseVersion=${{ steps.release.outputs.version }}
          -PisolatedRepository=${{ github.workspace }}/build/signed-maven-repository
          --no-parallel --no-daemon --max-workers=3

      - name: Verify signed artifacts
        run: |
          repository="${{ github.workspace }}/build/signed-maven-repository"
          artifact_count=0
          while IFS= read -r artifact; do
            artifact_count=$((artifact_count + 1))
            if [[ ! -f "${artifact}.asc" ]]; then
              echo "::error::Missing signature for ${artifact#$repository/}"
              exit 1
            fi
          done < <(
            find "$repository" -type f \
              \( -name "*.jar" -o -name "*.pom" -o -name "*.module" \)
          )
          if [[ "$artifact_count" -eq 0 ]]; then
            echo "::error::No Maven artifacts were produced"
            exit 1
          fi
          find "$repository" -name "*-sources.jar" -print -quit | grep -q .
          find "$repository" -name "*-javadoc.jar" -print -quit | grep -q .
          if [[ "${{ steps.release.outputs.is_release }}" == "true" ]] &&
            grep -R -n --include="*.pom" -- "-SNAPSHOT" "$repository"; then
            echo "::error::Release POMs cannot depend on SNAPSHOT artifacts"
            exit 1
          fi

      - name: Create signed repository archive
        working-directory: build/signed-maven-repository
        run: >-
          zip -qr
          ../viaduct-pg-persistence-${{ steps.release.outputs.version }}-signed.zip
          .

      - uses: actions/upload-artifact@v7
        with:
          name: viaduct-pg-persistence-${{ steps.release.outputs.version }}-signed
          path: |
            build/signed-maven-repository
            build/viaduct-pg-persistence-${{ steps.release.outputs.version }}-signed.zip
          if-no-files-found: error
          retention-days: 30
